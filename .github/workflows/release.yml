# Tag-gated release. Pushing a tag vX.Y.Z (matching Cargo.toml) runs:
#
#   version ─┐
#            ├─► build (x86_64 + aarch64 static musl) ─► release ─► container
#   gate ────┘
#
# Nothing is published unless the tag matches Cargo.toml and the full gate
# passes. No repository secrets are used: publishing uses the workflow's own
# GITHUB_TOKEN, scoped per job below.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kharonsec/berlog

jobs:
  version:
    name: tag matches Cargo.toml
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=$(.github/scripts/check-version.sh "$TAG")" >> "$GITHUB_OUTPUT"

  gate:
    uses: ./.github/workflows/gate.yml

  build:
    name: build ${{ matrix.target }}
    needs: [version, gate]
    runs-on: ${{ matrix.runner }}
    permissions: {}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - name: build
        run: cargo build --release --locked --target "$TARGET"
      - name: verify static binary and version
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/berlog"
          file "$bin"
          if ! file "$bin" | grep -Eq 'statically linked|static-pie linked'; then
            echo "::error::$bin is not statically linked"
            exit 1
          fi
          # Each target builds on a native runner, so the binary can run here.
          actual=$("$bin" --version)
          if [ "$actual" != "berlog $VERSION" ]; then
            echo "::error::binary reports '$actual', expected 'berlog $VERSION'"
            exit 1
          fi
          mkdir -p dist
          cp "$bin" "dist/berlog-$VERSION-$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: re-check tag against Cargo.toml
        run: .github/scripts/check-version.sh "$TAG"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum berlog-* > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 2
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "berlog $VERSION" \
            --generate-notes

  container:
    name: ghcr.io image (amd64 + arm64)
    needs: [version, release]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
