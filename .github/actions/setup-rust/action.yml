name: Set up Rust
description: Install the toolchain pinned in rust-toolchain.toml (no third-party action).
inputs:
  targets:
    description: Space-separated extra compilation targets to install.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        if ! command -v rustup >/dev/null; then
          echo "::error::rustup is not installed on this runner image"
          exit 1
        fi
        channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
        if [ -z "$channel" ]; then
          echo "::error::no channel found in rust-toolchain.toml"
          exit 1
        fi
        rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
        if [ -n "$TARGETS" ]; then
          # shellcheck disable=SC2086 # intentional word splitting
          rustup target add --toolchain "$channel" $TARGETS
        fi
        rustc --version
        cargo --version
